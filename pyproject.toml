[project]
name = "Persistence-Homology-and-Learning-PersLay"
version = "0.1.0"
description = "Reproduction of PersLay and extension"
readme = "README.md"
authors = [
    { name = "Rithika Shyam Kumar", email = "srithika2001@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "gudhi>=3.13.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "tensorflow>=2.21.0",
]

[project.scripts]
Persistence-Homology-and-Learning-PersLay = "persistence_homology_and_learning_perslay:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
]
